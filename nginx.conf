server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Entry points + SPA fallback: always revalidate so deploys take effect immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML/JS/CSS are not content-hashed, so must revalidate (never immutable)
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Media and fonts: short cache, not immutable (files can be replaced in place)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
